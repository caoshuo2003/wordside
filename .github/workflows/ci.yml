name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript and UI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm exec --yes --package=pnpm@9.15.9 -- pnpm --dir modules/cambridge-dictionary-api install --frozen-lockfile
      - run: npm test
      - run: npm run check
      - run: npm run build

  windows-native:
    name: Windows native
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm exec --yes --package=pnpm@9.15.9 -- pnpm --dir modules/cambridge-dictionary-api install --frozen-lockfile
      - run: npm test
      - run: npm run check
      - name: Check Rust toolchain
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
      - name: Test native dictionary and application logic
        run: ./tools/windows-cargo.ps1 -Action test
      - name: Test selection and hotkey logic (no desktop or system clipboard)
        run: |
          $filters = @(
            'capture::shortcut::',
            'capture::tests::',
            'capture::copy_policy::',
            'capture::timing::',
            'capture::windows_copy::tests::',
            'capture::windows_copy::ole::tests::',
            'capture::input::tests::',
            'capture::windows_text::semantics_tests::',
            'capture::diagnostics::tests::',
            'capture::hotkey::tests::',
            'capture::windows::tests::',
            'capture::compatibility::tests::',
            'capture::selection::tests::',
            'capture::probe::protocol_tests::',
            'capture::windows_edit::tests::',
            'dismissal::tests::'
          )
          foreach ($filter in $filters) {
            ./tools/windows-cargo.ps1 -Action test -TestFilter $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

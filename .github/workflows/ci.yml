name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript and UI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm exec --yes --package=pnpm@9.15.9 -- pnpm --dir modules/cambridge-dictionary-api install --frozen-lockfile
      - run: npm test
      - run: npm run check
      - run: npm run build

  windows-native:
    name: Windows native
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm exec --yes --package=pnpm@9.15.9 -- pnpm --dir modules/cambridge-dictionary-api install --frozen-lockfile
      - run: npm test
      - run: npm run check
      - name: Check Rust toolchain
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Test native dictionary and application logic
        run: ./tools/windows-cargo.ps1 -Action test
      - name: Test selection and hotkey logic (no desktop or system clipboard)
        run: |
          $filters = @(
            'capture::shortcut::',
            'capture::tests::',
            'capture::copy_policy::',
            'capture::timing::',
            'capture::windows_copy::tests::',
            'capture::windows_copy::ole::tests::',
            'capture::input::tests::',
            'capture::windows_text::semantics_tests::',
            'capture::diagnostics::tests::',
            'capture::hotkey::tests::',
            'capture::windows::tests::',
            'capture::compatibility::tests::',
            'capture::selection::tests::',
            'capture::probe::protocol_tests::',
            'capture::windows_edit::tests::',
            'dismissal::tests::'
          )
          foreach ($filter in $filters) {
            ./tools/windows-cargo.ps1 -Action test -TestFilter $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # The 0.3.0 native card. Kept apart from 0.2.0 until it replaces desktop/ in N5.
  native-card:
    name: Windows native card (apps/wordside)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/wordside/target
          key: native-card-${{ runner.os }}-${{ hashFiles('apps/wordside/Cargo.lock') }}
          restore-keys: native-card-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --manifest-path apps/wordside/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path apps/wordside/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: |
          # This one test of the word API (copied unchanged from 0.2.0) works with a 220 ms
          # budget and fails now and then on a busy machine. Everything else must pass first
          # time; it gets up to three tries.
          $timing = 'dictionary::tests::optional_deadline_retains_404_within_the_remaining_total_budget'
          cargo test --manifest-path apps/wordside/Cargo.toml --locked -- --skip $timing --skip capture:: --skip dismissal::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Selection reading: the same safe list as the 0.2.0 job above. The rest of
          # capture:: drives real windows and the clipboard and is only run by hand.
          $filters = @(
            'capture::shortcut::',
            'capture::tests::',
            'capture::copy_policy::',
            'capture::timing::',
            'capture::windows_copy::tests::',
            'capture::windows_copy::ole::tests::',
            'capture::input::tests::',
            'capture::windows_text::semantics_tests::',
            'capture::diagnostics::tests::',
            'capture::hotkey::tests::',
            'capture::windows::tests::',
            'capture::compatibility::tests::',
            'capture::selection::tests::',
            'capture::probe::protocol_tests::',
            'capture::windows_edit::tests::',
            'dismissal::tests::'
          )
          cargo test --manifest-path apps/wordside/Cargo.toml --locked -- @filters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($try in 1..3) {
            cargo test --manifest-path apps/wordside/Cargo.toml --locked -- --exact $timing
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "timing test failed on try $try"
          }
          exit 1
      - name: Third-party notices
        run: node tools/build-licenses.mjs --crate apps/wordside
      - name: Release build
        run: cargo build --manifest-path apps/wordside/Cargo.toml --locked --release
      - name: Release check (size, notices, diagnostic entries)
        run: ./tools/check-wordside.ps1 -Exe apps/wordside/target/release/wordside.exe

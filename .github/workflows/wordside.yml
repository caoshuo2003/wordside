name: WordSide

# Runs on pull requests that change the app, the tools its checks use, or this file; a
# merge to main is not checked again, since its pull request was. Documentation alone runs
# nothing. Run it by hand from Actions when wanted.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/wordside/**"
      - "tools/build-licenses.mjs"
      - "tools/check-wordside.ps1"
      - ".node-version"
      - ".github/workflows/wordside.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-card:
    name: Windows native card (apps/wordside)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/wordside/target
          key: native-card-${{ runner.os }}-${{ hashFiles('apps/wordside/Cargo.lock') }}
          restore-keys: native-card-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --manifest-path apps/wordside/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path apps/wordside/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: |
          # This one test of the word API (copied unchanged from 0.2.0) works with a 220 ms
          # budget and fails now and then on a busy machine. Everything else must pass first
          # time; it gets up to three tries.
          $timing = 'dictionary::tests::optional_deadline_retains_404_within_the_remaining_total_budget'
          # The selection fixtures that open real windows are #[ignore]d, so this needs no
          # filter list.
          cargo test --manifest-path apps/wordside/Cargo.toml --locked -- --skip $timing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($try in 1..3) {
            cargo test --manifest-path apps/wordside/Cargo.toml --locked -- --exact $timing
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "timing test failed on try $try"
          }
          exit 1
      - name: Third-party notices
        run: node tools/build-licenses.mjs
      - name: Release build
        run: cargo build --manifest-path apps/wordside/Cargo.toml --locked --release
      - name: Release check (size, notices, diagnostic entries)
        run: ./tools/check-wordside.ps1 -Exe apps/wordside/target/release/wordside.exe
